# .github/workflows/update-feed.yml
#
# Этот файл должен лежать РОВНО по пути: .github/workflows/update-feed.yml
# в корне репозитория Avito-feeds.
#
# ВАЖНО: автозапуск по расписанию сейчас ОТКЛЮЧЁН (закомментирован ниже).
# Пока мы не убедились, что скрипт generate_feed.py правильно работает
# с реальными 430 объявлениями (а не тестовыми данными), запускать его
# по ночам автоматически нельзя — это снова может стереть реальный фид.
#
# Запустить обновление можно только вручную: вкладка Actions -> "Update Avito Feed" ->
# кнопка "Run workflow". Как только мы протестируем скрипт и убедимся, что
# он работает верно на реальных данных — раскомментируем расписание обратно
# (уберите "#" перед строками schedule: и - cron:).

name: Update Avito Feed

on:
  # schedule:
  #   - cron: "0 21 * * *"
  workflow_dispatch: {}  # кнопка "Run workflow" в разделе Actions на GitHub

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # разрешение самому коммитить обратно в репозиторий

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Generate feed
        run: python generate_feed.py

      - name: Commit and push if changed
        run: |
          git config user.name "avito-feed-bot"
          git config user.email "actions@github.com"
          git add BaronNeon_feed.xlsx
          git diff --staged --quiet || git commit -m "Автообновление фида $(date +'%Y-%m-%d %H:%M')"
          git push
