name: Update Avito Feed

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch: {}

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Generate feed
        run: python generate_feed.py

      - name: Commit and push if changed
        run: |
          git config user.name "avito-feed-bot"
          git config user.email "actions@github.com"
          git add BaronNeon_feed.xlsx
          git diff --staged --quiet || git commit -m "Автообновление фида $(date +'%Y-%m-%d %H:%M')"
          git push
